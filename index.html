<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commission Queue</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* --- Banner + editable info panel (added) --- */
    .banner-wrap {
      width: 100%;
      max-height: 280px;
      overflow: hidden;
      line-height: 0;
    }
    .banner-img {
      width: 100%;
      height: 100%;
      max-height: 280px;
      object-fit: cover;
      display: block;
    }
    .banner-wrap:has(img[src=""]),
    .banner-img:not([src]) {
      display: none;
    }
    .editable-panel {
      min-height: 3em;
      margin: 0.75rem 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      white-space: pre-wrap;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="banner-wrap">
    <img id="banner-img" class="banner-img" src="banner.jpg" alt="Commission queue banner" />
  </div>

  <section id="editable-panel" class="editable-panel">
  Moving to a new system, please be patient!
  </section>

  <header class="page-header">
    <h1>Commission Queue</h1>
    <button id="open-form-btn" class="btn btn-primary">Request a Commission</button>
  </header>

  <section id="info-board" class="info-board hidden">
    <div id="info-content" class="info-content"></div>
  </section>

  <main>
    <div class="search-bar">
      <input type="search" id="search-input" placeholder="Search by customer or order name…" aria-label="Search the queue" />
    </div>
    <div id="queue-status" class="status-msg"></div>
    <div id="queue-sections"></div>
  </main>

  <!-- Card detail modal -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" data-close-modal>&times;</button>
      <h2 id="detail-title"></h2>
      <p id="detail-order" class="detail-order"></p>
      <div id="detail-body" class="detail-body"></div>
    </div>
  </div>

  <!-- Commission request modal -->
  <div id="form-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" data-close-modal>&times;</button>
      <h2>Request a Commission</h2>
      <form id="commission-form">
        <label for="customerName">Your Name *</label>
        <input type="text" id="customerName" name="customerName" required />

        <label for="orderName">Commission Type / Title</label>
        <input type="text" id="orderName" name="orderName" placeholder="e.g. Character portrait" />

        <label for="requestDetails">Details</label>
        <textarea id="requestDetails" name="requestDetails" rows="5" placeholder="Describe what you'd like..."></textarea>

        <!-- honeypot field, hidden from real users via CSS -->
        <input type="text" id="website" name="website" class="honeypot" tabindex="-1" autocomplete="off" />

        <button type="submit" class="btn btn-primary">Submit Request</button>
        <p id="form-status" class="status-msg"></p>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // --- Banner fallback (added) ---
    (function () {
      // Hide the banner wrapper if the image fails to load (e.g. no banner.jpg yet)
      var bannerImg = document.getElementById('banner-img');
      bannerImg.addEventListener('error', function () {
        bannerImg.closest('.banner-wrap').style.display = 'none';
      });
    })();
  </script>
</body>
</html>
